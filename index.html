<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#9B1B1B" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Winterhof" />
  <meta name="description" content="Winterhof & Zauberherbst – Euer detailverliebtes Herbst-, Winter- & Zauber-Farmspiel im handgemalten Hay-Day-Stil für iPhone & Android." />
  <title>Winterhof &amp; Zauberherbst</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./assets/icon-180.png" />
  <link rel="icon" type="image/png" href="./assets/icon-180.png" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="season-winter">
  <div id="app">
    <canvas id="game-canvas" aria-label="Winterhof &amp; Zauberherbst Spielwelt"></canvas>

    <!-- Full-Bleed Illustrated Hay-Day Splash / Loading Screen -->
    <div id="loading-screen">
      <div id="splash-bg" class="splash-bg"></div>
      <div class="splash-vignette"></div>
      <div class="splash-content">
        <div class="splash-plaque">
          <div class="splash-eyebrow">🦉 Herbst · Winter · Zauber</div>
          <h1 class="load-title">Winterhof</h1>
        </div>
        <div class="load-bar-wrap">
          <div class="load-bar-track">
            <div id="load-bar-fill" class="load-bar-fill" style="width: 12%"></div>
          </div>
          <div id="load-tip" class="load-sub">Die Schnee-Eule poliert die Laternen…</div>
        </div>
      </div>
    </div>

    <!-- Top Floating Storybook HUD -->
    <header class="hud-top">
      <div class="hud-group">
        <button id="btn-village" class="wood-pill" title="Hof, Kapitel &amp; Tiere">
          <span id="hud-level" class="level-star">1</span>
          <span class="village-meta">
            <span id="hud-village-name" class="village-name">Unser Winterhof</span>
            <span class="xp-track"><span id="hud-xp-fill" class="xp-fill" style="width: 0%"></span></span>
          </span>
        </button>
      </div>

      <div class="hud-group">
        <button id="btn-coins" class="wood-pill" title="Deine Hof-Münzen &amp; Hofladen">
          <span class="coin-badge">★</span>
          <span id="hud-coins">145</span>
        </button>
        <button id="btn-season" class="wood-pill icon-btn" title="Jahreszeit wechseln (Herbst / Winter)">❄️</button>
        <button id="btn-light" class="wood-pill icon-btn" title="Tageszeit wechseln">✨</button>
        <button id="btn-settings" class="wood-pill icon-btn" title="Ton &amp; Einstellungen">⚙️</button>
      </div>
    </header>

    <!-- Compact Guided Story Chapter Scroll (Piece-by-Piece Unlocking!) -->
    <button id="chapter-pill" class="chapter-pill hidden" title="Aktuelles Kapitel ansehen">
      <span class="ch-ico">📜</span>
      <span id="chapter-pill-text" class="ch-txt">Kapitel 1</span>
      <span id="chapter-pill-dot" class="ch-dot hidden">!</span>
    </button>

    <!-- Contextual Mode Banner (Move / Place / Store Deco) -->
    <div id="mode-banner" class="mode-banner hidden">
      <span id="mode-banner-text">Modus aktiv</span>
      <button id="mode-banner-store" class="banner-store hidden">📦 Lagern</button>
      <button id="mode-banner-cancel" class="banner-close">Fertig</button>
    </div>

    <!-- Subtle Zoom Controls & Level-3 Harvest-All Scythe -->
    <div class="zoom-controls" aria-label="Zoom und Werkzeuge">
      <button id="btn-zoom-in" class="zoom-btn" title="Heranzoomen">+</button>
      <button id="btn-zoom-out" class="zoom-btn" title="Herauszoomen">−</button>
      <button id="btn-scythe" class="scythe-btn hidden" title="Alles ernten (Sense ab Level 3)">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 19L16 8" />
          <path d="M16 8C19.5 6 20.5 10.5 16 14C13.5 11.5 13 9.5 16 8Z" fill="currentColor" opacity="0.9"/>
          <path d="M8 16L6 14" />
        </svg>
        <span id="scythe-count" class="scythe-count">0</span>
      </button>
    </div>

    <!-- Contextual Seed Picker (Hay-Day Swipe Planting!) -->
    <div id="seed-tray" class="seed-tray hidden" role="toolbar" aria-label="Saatgut wählen"></div>

    <!-- Toast Hint -->
    <div id="toast-tip" class="toast-tip hidden"></div>

    <!-- Bottom Carved Medallion Action Dock -->
    <nav class="hud-bottom" aria-label="Hauptmenü">
      <button id="dock-shop" class="dock-btn">
        <span class="d-ico">🛒</span>
        <span>Bau-Shop</span>
      </button>
      <button id="dock-barn" class="dock-btn">
        <span class="d-ico">🎒</span>
        <span>Vorrat</span>
        <span id="badge-barn" class="dock-badge hidden">0</span>
      </button>
      <button id="dock-orders" class="dock-btn">
        <span class="d-ico">📋</span>
        <span>Wünsche</span>
        <span id="badge-orders" class="dock-badge hidden">0</span>
      </button>
      <button id="dock-gifts" class="dock-btn">
        <span class="d-ico">🦉</span>
        <span>Eulenpost</span>
      </button>
      <button id="dock-move" class="dock-btn">
        <span class="d-ico">✋</span>
        <span>Umräumen</span>
      </button>
    </nav>

    <!-- Reusable Storybook Modal Sheet -->
    <div id="modal-backdrop" class="modal-backdrop hidden" role="dialog" aria-modal="true">
      <div class="modal-card">
        <div class="modal-header">
          <h2 id="modal-title" class="modal-title">Winterhof</h2>
          <button id="modal-close" class="modal-close" aria-label="Schließen">✕</button>
        </div>
        <div id="modal-tabs" class="modal-tabs" style="display:none;"></div>
        <div id="modal-body" class="modal-body"></div>
      </div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
