<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1A325C" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Winterhof" />
  <meta name="description" content="Winterhof – Ein handgemaltes Weihnachts-Farmspiel im Alpen-Stil für iPhone und Android." />
  <title>Winterhof</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./assets/icon-180.png" />
  <link rel="icon" type="image/png" href="./assets/icon-180.png" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app">
    <canvas id="game-canvas" aria-label="Winterhof Spielwelt"></canvas>

    <!-- Landscape-Only Orientation Guard (Zero Emojis · Commercial Minimalism) -->
    <div id="rotate-overlay" class="rotate-overlay" role="alert" aria-live="polite">
      <div class="rotate-card">
        <div class="rotate-icon-wrap" aria-hidden="true">
          <svg class="rotate-phone-svg" viewBox="0 0 88 88" width="76" height="76" fill="none">
            <rect x="27" y="14" width="34" height="60" rx="7" fill="#1E345A" stroke="#FDE68A" stroke-width="3"/>
            <rect x="32" y="22" width="24" height="40" rx="2.5" fill="#3B6296" opacity="0.65"/>
            <circle cx="44" cy="68" r="2.2" fill="#FDE68A"/>
            <path d="M68 25 A28 28 0 0 1 71 54" stroke="#E4B662" stroke-width="2.6" stroke-linecap="round"/>
            <path d="M65 51 L71 55 L75 49" stroke="#E4B662" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <span class="rotate-kicker">WINTERHOF</span>
        <h2 class="rotate-title">BITTE QUERFORMAT</h2>
        <p class="rotate-sub">Drehe dein Gerät ins Querformat, um das Alpen-Weihnachtsdorf in voller Breite zu spielen.</p>
      </div>
    </div>

    <!-- Full-Bleed Illustrated Alpine Splash / Loading Screen (Zero Emojis) -->
    <div id="loading-screen">
      <div id="splash-bg" class="splash-bg"></div>
      <div class="splash-vignette"></div>
      <div class="splash-content">
        <div class="splash-crest">
          <span class="splash-kicker">ALPEN-WEIHNACHTSDORF</span>
          <h1 class="load-title">WINTERHOF</h1>
        </div>
        <div class="load-bar-wrap">
          <div class="load-bar-track">
            <div id="load-bar-fill" class="load-bar-fill" style="width: 14%"></div>
          </div>
          <div id="load-tip" class="load-sub">Winterdorf wird vorbereitet...</div>
        </div>
      </div>
    </div>

    <!-- Top-Left: Hay-Day Level Star Crest + Compact Chapter Scroll -->
    <div class="hud-top-left">
      <button id="btn-village" class="level-crest-btn" title="Winterhof, Sammelbuch und Tiere">
        <span class="level-star-wrap">
          <svg class="level-star-svg" viewBox="0 0 44 44" aria-hidden="true">
            <polygon points="22,2 27.5,14.5 41,16 31,25 33.8,38.5 22,31.5 10.2,38.5 13,25 3,16 16.5,14.5" fill="url(#lvlGold)" stroke="#FFFDF5" stroke-width="2.5" stroke-linejoin="round"/>
            <defs>
              <linearGradient id="lvlGold" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#FEF08A"/>
                <stop offset="55%" stop-color="#F59E0B"/>
                <stop offset="100%" stop-color="#B45309"/>
              </linearGradient>
            </defs>
          </svg>
          <span id="hud-level" class="level-num">1</span>
        </span>
        <span class="village-meta">
          <span id="hud-village-name" class="village-name">Winterhof</span>
          <span class="xp-track"><span id="hud-xp-fill" class="xp-fill" style="width: 0%"></span></span>
        </span>
      </button>

      <button id="chapter-pill" class="chapter-chip hidden" title="Aktuelles Kapitel">
        <span class="chip-icon" aria-hidden="true">
          <svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 3h9a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 1-2z"/><path d="M7.5 7.5h5M7.5 11h5"/></svg>
        </span>
        <span id="chapter-pill-text" class="ch-txt">Kapitel 1</span>
        <span id="chapter-pill-dot" class="ch-dot hidden">!</span>
      </button>
    </div>

    <!-- Top-Right: Coin Counter + Minimal Time-of-Day & Settings -->
    <div class="hud-top-right">
      <button id="btn-coins" class="coin-pill" title="Münzen und Hofladen">
        <span class="coin-svg-wrap" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22">
            <circle cx="12" cy="12" r="10.5" fill="#FACC15" stroke="#8C4E08" stroke-width="2"/>
            <circle cx="12" cy="12" r="7.5" fill="#FEF08A" opacity="0.55"/>
            <polygon points="12,5.5 13.8,10 18.5,10 14.8,12.8 16.2,17.5 12,14.7 7.8,17.5 9.2,12.8 5.5,10 10.2,10" fill="#B45309"/>
          </svg>
        </span>
        <span id="hud-coins" class="coin-num">145</span>
      </button>

      <button id="btn-light" class="circle-util-btn" title="Tageszeit wechseln" aria-label="Tageszeit"></button>
      <button id="btn-settings" class="circle-util-btn" title="Ton und Einstellungen" aria-label="Einstellungen"></button>
    </div>

    <!-- Contextual Mode Banner (Move / Place / Store Deco) -->
    <div id="mode-banner" class="mode-banner hidden">
      <span id="mode-banner-text">Modus aktiv</span>
      <button id="mode-banner-store" class="banner-store hidden">Einlagern</button>
      <button id="mode-banner-cancel" class="banner-close">Fertig</button>
    </div>

    <!-- Right-Side Contextual Level-3 Harvest-All Scythe (Mobile uses Pinch-Zoom, zero +/- clutter!) -->
    <div class="zoom-controls" aria-label="Werkzeuge">
      <button id="btn-scythe" class="scythe-btn hidden" title="Alle reifen Felder ernten (Level 3)">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 19L16 8"/>
          <path d="M16 8C19.5 6 20.5 10.5 16 14C13.5 11.5 13 9.5 16 8Z" fill="currentColor" opacity="0.9"/>
          <path d="M8 16L6 14"/>
        </svg>
        <span id="scythe-count" class="scythe-count">0</span>
      </button>
    </div>

    <!-- Contextual Seed Picker (Appears only when planting!) -->
    <div id="seed-tray" class="seed-tray hidden" role="toolbar" aria-label="Saatgut wählen"></div>

    <!-- Clean Non-Intrusive Toast Notification -->
    <div id="toast-tip" class="toast-tip hidden"></div>

    <!-- Bottom-Left: Signature Hay-Day Build Shop & Move Medallions -->
    <div class="hud-corner-bl" aria-label="Bauen und Gestalten">
      <button id="dock-shop" class="medallion-btn primary" title="Bau-Shop">
        <span id="ico-shop" class="m-svg"></span>
        <span class="m-label">SHOP</span>
      </button>
      <button id="dock-move" class="medallion-btn compact" title="Umräumen">
        <span id="ico-move" class="m-svg"></span>
      </button>
    </div>

    <!-- Bottom-Right: Barn / Orders / Post Floating Medallions -->
    <div class="hud-corner-br" aria-label="Hofverwaltung">
      <button id="dock-barn" class="medallion-btn" title="Scheune und Hofladen">
        <span id="ico-barn" class="m-svg"></span>
        <span id="hud-barn-mini" class="m-label">VORRAT</span>
        <span id="badge-barn" class="medallion-badge hidden">0</span>
      </button>
      <button id="dock-orders" class="medallion-btn" title="Wunschzettel und Erfolge">
        <span id="ico-orders" class="m-svg"></span>
        <span class="m-label">AUFTRÄGE</span>
        <span id="badge-orders" class="medallion-badge hidden">0</span>
      </button>
      <button id="dock-gifts" class="medallion-btn" title="Winterpost-Päckchen">
        <span id="ico-gifts" class="m-svg"></span>
        <span class="m-label">POST</span>
      </button>
    </div>

    <!-- Reusable Parchment Storybook Modal Sheet -->
    <div id="modal-backdrop" class="modal-backdrop hidden" role="dialog" aria-modal="true">
      <div class="modal-card">
        <div class="modal-header">
          <h2 id="modal-title" class="modal-title">Winterhof</h2>
          <button id="modal-close" class="modal-close" aria-label="Schließen">
            <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 5l10 10M15 5L5 15"/></svg>
          </button>
        </div>
        <div id="modal-tabs" class="modal-tabs" style="display:none;"></div>
        <div id="modal-body" class="modal-body"></div>
      </div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
